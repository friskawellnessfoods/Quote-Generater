<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friska Leads</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--navy:#0a1a6e; --navy-deep:#08155a; --accent:#10b981; --accent-soft:#e7f7f1;
--bg:#f4f7fc; --ink:#16213e; --muted:#6b7596; --line:#e2e7f1;
}
*{ box-sizing:border-box; }
body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; background:var(--bg); margin:0; color:var(--ink);
position:relative; overflow-x:hidden; min-height:100vh;
}
body::before,body::after{ content:""; position:fixed; border-radius:50%; filter:blur(70px); z-index:0; pointer-events:none; }
body::before{ width:340px; height:340px; background:rgba(16,185,129,0.14); top:-120px; left:-120px; }
body::after{ width:380px; height:380px; background:rgba(10,26,110,0.08); bottom:-160px; right:-140px; }
h1,h2,h3,.leadName,.statNum,.btn,.brand{ font-family:"Poppins",system-ui,sans-serif; }

.header{ position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:13px 0; display:flex; align-items:center; justify-content:center; }
.logo{ height:40px; max-width:180px; object-fit:contain; }
.brand{ position:absolute; left:18px; font-weight:800; font-size:18px; color:var(--navy); }

.wrap{ position:relative; z-index:1; max-width:880px; margin:0 auto; padding:18px 16px 70px; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
.statCard{ background:white; border-radius:16px; padding:14px 14px; box-shadow:0 4px 14px rgba(20,33,62,0.06); text-align:center; border-left:3px solid var(--line); }
.statCard.total{ border-left-color:var(--navy); }
.statCard.booked{ border-left-color:var(--accent); }
.statNum{ font-size:23px; font-weight:800; color:var(--navy); line-height:1; }
.statCard.booked .statNum{ color:var(--accent); }
.statLbl{ font-size:11.5px; color:var(--muted); margin-top:6px; font-weight:600; }
@media(max-width:520px){ .stats{ grid-template-columns:repeat(2,1fr); } }

.searchWrap{ position:relative; margin-bottom:12px; }
.searchWrap svg{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none; }
.searchWrap input{ width:100%; padding:14px 44px 14px 44px; border-radius:14px; border:1.5px solid var(--line); font-size:15px; background:white; color:var(--ink); }
.searchWrap input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(16,185,129,0.12); }
.searchClear{ position:absolute; right:10px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:none; background:transparent; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; display:none; }
.searchClear.show{ display:block; }

.toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.segment{ display:flex; gap:4px; background:#eef1f7; border-radius:12px; padding:4px; overflow-x:auto; flex:1; min-width:0; }
.segment button{ border:none; background:transparent; padding:9px 14px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; flex:1; transition:all .15s; }
.segment button.on{ background:white; color:var(--navy); box-shadow:0 2px 6px rgba(20,33,62,0.10); }
.sortSel{ padding:12px 13px; border-radius:12px; border:1.5px solid var(--line); font-size:14px; background:white; color:var(--ink); font-weight:600; cursor:pointer; }

.dateRow{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
.dateRange{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; }
.dateBox{ padding:11px 10px; border-radius:12px; border:1.5px solid var(--line); font-size:13.5px; background:white; color:var(--ink); font-weight:600; min-width:0; flex:1; }
.dateBox:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(16,185,129,0.12); }
.rangeDash{ color:var(--muted); flex:none; }
.clearDates{ flex:none; width:38px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:white; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; display:none; align-items:center; justify-content:center; }
.clearDates.show{ display:flex; }
.refreshBtn{ padding:12px 16px; border-radius:12px; border:none; background:var(--navy); color:white; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:7px; }
.refreshBtn svg{ width:16px; height:16px; }

.list{ display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
@media(min-width:640px){ .list{ grid-template-columns:1fr 1fr; } }
.group.open{ grid-column:1 / -1; }
.group{ background:white; border-radius:18px; box-shadow:0 4px 14px rgba(20,33,62,0.07); overflow:hidden; border:1.5px solid transparent; transition:all .15s; }
.group.open{ border-color:var(--line); box-shadow:0 8px 20px rgba(20,33,62,0.10); }
.groupHead{ display:flex; align-items:center; gap:11px; padding:14px 14px; cursor:pointer; user-select:none; }
.gLeft{ flex:1; min-width:0; }
.leadName{ font-size:15.5px; font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gMeta{ font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.countPill{ background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:11px; padding:3px 9px; border-radius:99px; }
.gRight{ display:flex; align-items:center; gap:8px; flex:none; }
.actIcon{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-decoration:none; flex:none; transition:all .15s; }
.actIcon.wa{ background:#25D366; box-shadow:0 4px 11px rgba(37,211,102,0.3); }
.actIcon.wa:hover{ transform:scale(1.05); box-shadow:0 6px 14px rgba(37,211,102,0.4); }
.actIcon.wa svg{ width:19px; height:19px; color:white; }
.actIcon.call{ background:white; border:1.5px solid var(--line); }
.actIcon.call:hover{ border-color:var(--navy); }
.actIcon.call svg{ width:17px; height:17px; color:var(--navy); }
.chev{ color:#aab1c9; transition:transform .25s ease; flex:none; }
.chev svg{ width:20px; height:20px; display:block; }
.group.open .chev{ transform:rotate(180deg); }

.flag{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
.flag.booked{ background:#fff4e2; color:#c97a0e; }
.flag.msgd{ background:var(--accent-soft); color:var(--accent); }

.groupBody{ display:none; padding:0 14px 14px; }
.group.open .groupBody{ display:block; }

.sub{ background:#f7f9fd; border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-top:10px; }
.subTop{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px; }
.subPlan{ font-weight:700; color:var(--navy); font-size:14.5px; }
.subDate{ font-size:11.5px; color:var(--muted); white-space:nowrap; flex:none; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px; }
.chip{ font-size:12px; font-weight:600; padding:5px 10px; border-radius:99px; background:#eef1fb; color:var(--navy); }
.chip.price{ background:var(--accent-soft); color:var(--accent); }
.chip.rec{ background:#fff4e2; color:#c97a0e; }
.chip.sea{ background:#e6f6ff; color:#0369a1; }
.kv{ font-size:12.5px; color:var(--muted); line-height:1.7; }
.kvRow{ display:flex; gap:8px; }
.kvRow .k{ color:#9aa2bd; min-width:64px; flex:none; }
.kvRow .v{ color:var(--ink); font-weight:600; word-break:break-word; }
.bio{ font-size:12px; color:#9aa2bd; margin-top:6px; }

.state{ text-align:center; padding:60px 20px; color:var(--muted); }
.state .big{ font-size:17px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.spinner{ width:34px; height:34px; border:3px solid var(--line); border-top:3px solid var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.retryBtn{ margin-top:14px; padding:11px 20px; border:none; border-radius:12px; background:var(--navy); color:white; font-weight:700; cursor:pointer; }

.toast{ position:fixed; bottom:20px; right:20px; background:white; color:var(--ink); padding:14px 18px; border-radius:12px; box-shadow:0 6px 20px rgba(20,33,62,0.15); font-weight:600; font-size:13px; display:none; z-index:100; animation:slideUp .3s ease; }
.toast.show{ display:block; }
@keyframes slideUp{ from{ transform:translateY(20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.toast.success{ border-left:3px solid var(--accent); }
.toast.error{ border-left:3px solid #ef4444; }

.modal{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:101; align-items:center; justify-content:center; }
.modal.show{ display:flex; }
.modalContent{ background:white; border-radius:18px; padding:28px; max-width:500px; max-height:80vh; overflow-y:auto; box-shadow:0 10px 40px rgba(20,33,62,0.2); }
.modalHead{ font-size:18px; font-weight:700; color:var(--navy); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.modalList{ font-size:14px; line-height:1.8; color:var(--ink); }
.modalList li{ margin-bottom:10px; padding-left:6px; }
.modalList .ph{ color:var(--muted); font-size:12px; }
.modalFoot{ display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
.modalFoot button{ padding:10px 16px; border-radius:12px; border:none; font-weight:600; cursor:pointer; }
.modalFoot .btnClose{ background:#eef1f7; color:var(--ink); }
.modalFoot .btnClose:hover{ background:var(--line); }

.loadingOverlay{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:100; gap:16px; }
.loadingOverlay.show{ display:flex; }
.loadingOverlay .spinner{ margin:0; }
</style>
</head>

<body>

<div class="header">
<div class="brand">Friska Leads</div>
<img src="logo.png" class="logo">
</div>

<div class="wrap">

<div class="stats">
<div class="statCard total"><div class="statNum" id="statClients">–</div><div class="statLbl">Clients</div></div>
<div class="statCard"><div class="statNum" id="statSubs">–</div><div class="statLbl">Submissions</div></div>
<div class="statCard"><div class="statNum" id="statToday">–</div><div class="statLbl">Today</div></div>
<div class="statCard booked"><div class="statNum" id="statBooked">–</div><div class="statLbl">Booked</div></div>
</div>

<div class="searchWrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="search" type="text" placeholder="Search by name or phone…" autocomplete="off" oninput="render()">
<button class="searchClear" id="searchClear" onclick="clearSearch()">&times;</button>
</div>

<div class="toolbar">
<div class="segment" id="statusSeg">
<button data-st="all" class="on" onclick="setStatus(this)">All</button>
<button data-st="new" onclick="setStatus(this)">New</button>
<button data-st="msgd" onclick="setStatus(this)">Messaged</button>
<button data-st="booked" onclick="setStatus(this)">Booked</button>
</div>
<select class="sortSel" id="sortSel">
<option value="latest">Latest</option>
<option value="oldest">Oldest</option>
<option value="billHigh">Highest bill</option>
<option value="billLow">Lowest bill</option>
<option value="near">Nearest</option>
<option value="far">Farthest</option>
</select>
</div>

<div class="dateRow">
<div class="dateRange">
<input class="dateBox" id="fromDate" type="date" title="From date">
<span class="rangeDash">&ndash;</span>
<input class="dateBox" id="toDate" type="date" title="To date">
<button class="clearDates" id="clearDates" title="Clear dates" onclick="clearDates()">&times;</button>
</div>
<button class="refreshBtn" onclick="loadLeads()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
<button class="refreshBtn" style="background:#10b981;" onclick="removeConvertedClients()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6h16z"/></svg>Remove Converted</button>
</div>

<div id="content"></div>

</div>

<div class="toast" id="toast"></div>

<div class="loadingOverlay" id="loadingOverlay">
<div class="spinner"></div>
<div>Removing converted clients...</div>
</div>

<div class="modal" id="cleanupModal">
<div class="modalContent">
<div class="modalHead">✓ Converted Clients Removed</div>
<div class="modalList" id="cleanupList"></div>
<div class="modalFoot">
<button class="btnClose" onclick="closeCleanupModal()">Done</button>
</div>
</div>
</div>

<script src="config.js"></script>
<script>

const API = (typeof API_URL !== "undefined" && API_URL) ? API_URL : "";
let ALL = [], FLAGS = {}, STATUS = "all";

function digKey(p){ var d=(""+(p||"")).replace(/\D/g,""); return d.length>10?d.slice(-10):d; }
function waDigits(raw){ let d=(""+(raw||"")).replace(/\D/g,''); if(d.length===10) d="91"+d; return d; }

function draftMessage(name){
  let greet = name ? ("Hello " + name + ",") : "Hello,";
  return greet + "\n\n" +
    "This is Friska Wellness Foods. We noticed you recently explored our meal plans but didn't complete your booking.\n\n" +
    "We'd love to know if there was anything holding you back, or any questions we can help with — we're happy to help you get started. 😊";
}

let NAME_BY_DIG = {};

function markFlag(phone, field){
  if(!API) return;
  let key = digKey(phone);
  document.querySelector(".group[data-key='"+key+"']")?.classList.add("updating");
  fetch(API + "?action=" + (field==="contacted"?"markContacted":"markBooked"), {
    method:"POST",
    keepalive:true,
    body: JSON.stringify({ phone: phone })
  }).then(r=>r.json()).then(d=>{
    if(!FLAGS[key]) FLAGS[key]={};
    FLAGS[key][field]=true;
    updateFlagUI(key, field);
  }).catch(err=>{
    console.error("Flag update failed:", err);
    showToast("Failed to update. Retrying…", "error");
    setTimeout(()=>markFlag(phone, field), 1500);
  }).finally(()=>{
    document.querySelector(".group[data-key='"+key+"']")?.classList.remove("updating");
  });
}

function updateFlagUI(key, field){
  let grp = document.querySelector(".group[data-key='"+key+"']");
  if(!grp) return;
  let meta = grp.querySelector(".gMeta");
  if(!meta) return;
  let flagClass = field==="contacted" ? "msgd" : "booked";
  if(!grp.querySelector(".flag."+flagClass)){
    let flag = document.createElement("span");
    flag.className = "flag " + flagClass;
    flag.innerHTML = field==="contacted" ? "Messaged" : "Booked";
    meta.appendChild(flag);
  }
  showToast(field==="contacted" ? "✓ Marked as messaged" : "✓ Marked as booked", "success");
}

function openWA(dig, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  markFlag(dig, "contacted");
  let enc = encodeURIComponent(draftMessage(NAME_BY_DIG[dig] || ""));
  let waUrl = "https://wa.me/" + dig + "?text=" + enc;
  if(/android/i.test(navigator.userAgent)){
    window.location.href = "intent://send?phone=" + dig + "&text=" + enc +
      "#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=" + encodeURIComponent(waUrl) + ";end";
  } else { window.open(waUrl, "_blank"); }
  return false;
}
function stop(ev){ if(ev) ev.stopPropagation(); }

function showToast(msg, type){
  let toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast show " + (type||"");
  setTimeout(()=>toast.classList.remove("show"), 3000);
}

function fmtDate(v){
  if(!v) return "";
  let d = new Date(v); if(isNaN(d.getTime())) return (""+v);
  return d.toLocaleDateString("en-IN",{ day:"2-digit", month:"short", year:"numeric" }) +
         ", " + d.toLocaleTimeString("en-IN",{ hour:"2-digit", minute:"2-digit" });
}
function fmtDay(v){ let d=new Date(v); if(isNaN(d.getTime())) return ""; return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}); }
function isToday(v){ let d=new Date(v); if(isNaN(d.getTime())) return false; let n=new Date(); return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
function esc(s){ return (""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const WA_SVG = "<svg viewBox='0 0 24 24' fill='currentColor'><path d='M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.02h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.37c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.23 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z'/></svg>";
const CALL_SVG = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z'/></svg>";

function loadLeads(){
  if(!API){ showToast("config.js / API_URL not found.", "error"); return; }
  document.getElementById("content").innerHTML = "<div class='state'><div class='spinner'></div>Loading leads…</div>";
  Promise.all([
    fetch(API + "?action=leads").then(r=>r.json()).catch(()=>({leads:[]})),
    fetch(API + "?action=leadFlags").then(r=>r.json()).catch(()=>({flags:{}}))
  ]).then(([d,f])=>{
    ALL   = (d && d.leads) ? d.leads : [];
    FLAGS = (f && f.flags) ? f.flags : {};
    render();
  }).catch(()=>{ showToast("Couldn't load leads. Check the Apps Script URL / deployment.", "error"); });
}

function groupLeads(rows){
  let map = {};
  rows.forEach(l=>{
    let key = (""+(l.phone||"")).replace(/\D/g,'');
    if(!key) key = "noPhone_" + ((l.name||"")+Math.random());
    if(!map[key]) map[key] = { key:key, phone:l.phone, name:l.name, subs:[] };
    map[key].subs.push(l);
  });
  let groups = Object.keys(map).map(k=>map[k]);
  groups.forEach(g=>{
    g.subs.sort((a,b)=> new Date(b.date) - new Date(a.date));
    g.name   = g.subs[0].name  || g.name;
    g.phone  = g.subs[0].phone || g.phone;
    g.latest = g.subs[0].date;
    let p = Number(g.subs[0].price);    g.price = isNaN(p) ? 0 : p;
    let d = Number(g.subs[0].distance); g.dist  = isNaN(d) ? null : d;
  });
  return groups;
}

function matchStatus(fl){
  if(STATUS==="all") return true;
  let booked=!!fl.booked, msgd=!!fl.contacted;
  if(STATUS==="booked") return booked;
  if(STATUS==="msgd")   return msgd && !booked;
  if(STATUS==="new")    return !msgd && !booked;
  return true;
}
function setStatus(btn){
  document.querySelectorAll('#statusSeg button').forEach(b=>b.classList.toggle('on', b===btn));
  STATUS = btn.dataset.st;
  render();
}
function clearSearch(){ document.getElementById("search").value=""; render(); }

function render(){
  let sort = document.getElementById("sortSel").value;
  let fromVal = document.getElementById("fromDate").value;
  let toVal   = document.getElementById("toDate").value;
  let q = document.getElementById("search").value.trim().toLowerCase();
  let qDigits = q.replace(/\D/g,"");

  document.getElementById("clearDates").classList.toggle("show", !!(fromVal || toVal));
  document.getElementById("searchClear").classList.toggle("show", !!q);

  let allGroups = groupLeads(ALL);
  document.getElementById("statClients").innerText = allGroups.length;
  document.getElementById("statSubs").innerText = ALL.length;
  let todaySet = {};
  ALL.forEach(l=>{ if(isToday(l.date)){ let k=(""+(l.phone||"")).replace(/\D/g,'')||("x"+(l.name||"")); todaySet[k]=1; } });
  document.getElementById("statToday").innerText = Object.keys(todaySet).length;
  let bookedCount = allGroups.filter(g=> (FLAGS[digKey(g.phone)]||{}).booked ).length;
  document.getElementById("statBooked").innerText = bookedCount;

  let fromDay = fromVal ? ymdInt(fromVal) : null;
  let toDay   = toVal   ? ymdInt(toVal)   : null;
  let lo=null, hi=null;
  if(fromDay && toDay){ lo=Math.min(fromDay,toDay); hi=Math.max(fromDay,toDay); }
  else if(fromDay){ lo=hi=fromDay; } else if(toDay){ lo=hi=toDay; }
  let hasDate = (lo!==null);
  let rows = hasDate ? ALL.filter(l=>{ let dn=dateInt(l.date); return dn!==null && dn>=lo && dn<=hi; }) : ALL;

  let list = groupLeads(rows);

  list = list.filter(g=>{
    let fl = FLAGS[digKey(g.phone)] || {};
    if(!matchStatus(fl)) return false;
    if(!q) return true;
    let nameHit = (g.name||"").toLowerCase().indexOf(q) !== -1;
    let phoneHit = qDigits && digKey(g.phone).indexOf(qDigits) !== -1;
    return nameHit || phoneHit;
  });

  list.sort((a,b)=>{
    if(sort==="latest")   return new Date(b.latest) - new Date(a.latest);
    if(sort==="oldest")   return new Date(a.latest) - new Date(b.latest);
    if(sort==="billHigh") return b.price - a.price;
    if(sort==="billLow")  return a.price - b.price;
    if(sort==="near")     return distCmp(a.dist, b.dist, true);
    if(sort==="far")      return distCmp(a.dist, b.dist, false);
    return 0;
  });

  if(!list.length){
    let msg = q ? "No leads match your search." : (hasDate ? "No leads in this date range." : (STATUS!=="all" ? "No leads with this status." : "New leads will appear here."));
    document.getElementById("content").innerHTML = "<div class='state'><div class='big'>No leads found</div>"+msg+"</div>";
    return;
  }

  let html = "<div class='list'>";
  NAME_BY_DIG = {};
  list.forEach(g=>{
    let n = g.subs.length;
    let dig = waDigits(g.phone);
    NAME_BY_DIG[dig] = g.name || "";
    let key = digKey(g.phone), fl = FLAGS[key] || {};
    let badges = (fl.booked ? "<span class='flag booked'>Booked</span>" : "") +
                 (fl.contacted ? "<span class='flag msgd'>Messaged</span>" : "");
    let subsHtml = g.subs.map(subCard).join("");
    let callHtml = dig ? "<a class='actIcon call' href='tel:+"+dig+"' onclick='stop(event)'>"+CALL_SVG+"</a>" : "";
    html +=
      "<div class='group' data-key='"+key+"'>" +
        "<div class='groupHead' onclick='toggleCard(this)'>" +
          "<div class='gLeft'>" +
            "<div class='leadName'>"+esc(g.name||"Unknown")+"</div>" +
            "<div class='gMeta'>"+esc(g.phone||"")+
              "<span class='countPill'>"+n+" submission"+(n>1?"s":"")+"</span>"+
              "<span>"+fmtDay(g.latest)+"</span>"+
              badges +
            "</div>" +
          "</div>" +
          "<div class='gRight'>" +
            callHtml +
            "<a class='actIcon wa' href='#' onclick='return openWA(\""+dig+"\", event)' title='Send message & mark as contacted'>"+WA_SVG+"</a>" +
            "<span class='chev'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg></span>" +
          "</div>" +
        "</div>" +
        "<div class='groupBody'>"+subsHtml+"</div>" +
      "</div>";
  });
  html += "</div>";
  document.getElementById("content").innerHTML = html;
}

function subCard(l){
  let chips = "";
  if(l.price)       chips += "<span class='chip price'>&#8377;"+esc(l.price)+"</span>";
  if(l.recommended) chips += "<span class='chip rec'>&#9733; "+esc(l.recommended)+"</span>";
  if(l.addons)      chips += "<span class='chip sea'>&#129424; "+esc(l.addons)+"</span>";

  let rows = "";
  rows += kvRow("Meals", l.meals);
  rows += kvRow("Slots", l.slots);
  if(l.location){ rows += kvRow("Location", l.mapsLink ? "<a href='"+esc(l.mapsLink)+"' target='_blank'>"+esc(l.location)+"</a>" : esc(l.location)); }

  let bio = [];
  if(l.age)    bio.push("Age "+esc(l.age));
  if(l.height) bio.push(esc(l.height));
  if(l.weight) bio.push(esc(l.weight)+"kg");
  if(l.distance!=="" && l.distance!=null) bio.push(esc(l.distance)+" km");

  let planLine = [l.plan, l.duration].filter(Boolean).map(esc).join(" &middot; ") || "Submission";

  return "<div class='sub'>" +
    "<div class='subTop'><span class='subPlan'>"+planLine+"</span><span class='subDate'>"+fmtDate(l.date)+"</span></div>" +
    (chips ? "<div class='chips'>"+chips+"</div>" : "") +
    "<div class='kv'>"+rows+"</div>" +
    (bio.length ? "<div class='bio'>"+bio.join("  &middot;  ")+"</div>" : "") +
  "</div>";
}
function kvRow(k,v){ return "<div class='kvRow'><span class='k'>"+k+"</span><span class='v'>"+(v||"-")+"</span></div>"; }

function distCmp(a,b,asc){ if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return asc?(a-b):(b-a); }
function ymdInt(ymd){ let p=ymd.split("-"); return (+p[0])*10000+(+p[1])*100+(+p[2]); }
function dateInt(v){ let d=new Date(v); if(isNaN(d.getTime())) return null; return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }

function clearDates(){ document.getElementById("fromDate").value=""; document.getElementById("toDate").value=""; render(); }
function toggleCard(headEl){ headEl.parentNode.classList.toggle("open"); }

document.getElementById("sortSel").addEventListener("change", render);
document.getElementById("fromDate").addEventListener("change", render);
document.getElementById("toDate").addEventListener("change", render);

function closeCleanupModal(){ document.getElementById("cleanupModal").classList.remove("show"); loadLeads(); }

async function removeConvertedClients(){
  if(!API){ showToast("API_URL not configured", "error"); return; }
  
  document.getElementById("loadingOverlay").classList.add("show");
  
  try {
    // Fetch master clients from the other sheet's Apps Script
    const masterResp = await fetch("https://script.google.com/macros/s/AKfycbxKsblVRWTB4ozLwsgl6NRFj8uq1TGzu0o1Czdk1xquOEn6ZU7gjGw0m-YeMDoFFRqi/exec?action=clients");
    const masterData = await masterResp.json();
    const masterClients = masterData.clients || [];
    
    if(!masterClients.length){
      document.getElementById("loadingOverlay").classList.remove("show");
      showToast("No master clients found", "error");
      return;
    }
    
    // Normalize master client phone numbers
    let masterMap = {};
    masterClients.forEach(c => {
      let ph = (c.phone || c[2] || "").toString().replace(/\D/g, "").slice(-10);
      let nm = (c.name || c[1] || "").toString().trim().toLowerCase();
      if(ph) masterMap[ph + "|" + nm] = c;
    });
    
    // Find matching leads and delete
    let removed = [];
    for(let lead of ALL){
      let leadPh = (lead.phone || "").toString().replace(/\D/g, "").slice(-10);
      let leadNm = (lead.name || "").toString().trim().toLowerCase();
      let key = leadPh + "|" + leadNm;
      
      if(masterMap[key]){
        try {
          const delResp = await fetch(API + "?action=deleteLead", {
            method: "POST",
            body: JSON.stringify({ phone: lead.phone, name: lead.name })
          });
          const delData = await delResp.json();
          if(delData.success && delData.rows && delData.rows.length){
            removed.push(...delData.rows);
          }
        } catch(e){
          console.error("Delete failed for", lead.name, e);
        }
      }
    }
    
    document.getElementById("loadingOverlay").classList.remove("show");
    
    if(removed.length){
      let html = "<ul class='modalList'>";
      removed.forEach(r => {
        html += "<li><strong>"+esc(r.name)+"</strong><br><span class='ph'>📞 "+esc(r.phone)+"</span></li>";
      });
      html += "</ul>";
      document.getElementById("cleanupList").innerHTML = html;
      document.getElementById("cleanupModal").classList.add("show");
      showToast("✓ Removed "+removed.length+" converted client"+(removed.length>1?"s":""), "success");
    } else {
      showToast("No converted clients to remove", "error");
    }
  } catch(e){
    document.getElementById("loadingOverlay").classList.remove("show");
    console.error("Cleanup failed:", e);
    showToast("Cleanup failed: " + e.message, "error");
  }
}

loadLeads();
